<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foco · Planejador</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg2:#000;--bgi:#000;--rgb:255,230,0;--on:#000;--glass:rgba(255,255,255,.04);--line:rgba(var(--rgb),.22);--ink:#F6F6F8;--muted:#A39F7A;--pu:#FFE600;--pu2:#FFF04D;--rd:#FF4D4D;--pk:#F472B6;--am:#FBBF24;--bl:#60A5FA;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{-webkit-appearance:none;appearance:none}
button:focus:not(:focus-visible){outline:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:400 15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;background:radial-gradient(520px 420px at 100% -5%,rgba(var(--rgb),.15),transparent 70%),radial-gradient(400px 300px at -10% 60%,rgba(var(--rgb),.07),transparent 70%),var(--bgi);background-attachment:fixed}
#app{max-width:520px;margin:0 auto;padding:18px 16px 130px}
h1,h2{margin:0}
.hd p{margin:0;color:var(--muted);font-size:14px;text-transform:capitalize}
.hd p.dt{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:16px}
.hd h1{font-size:26px;font-weight:800;line-height:1.2;margin:4px 0 16px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(var(--rgb),.06)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{padding:16px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.lb{font-weight:600;font-size:14px}
.c small{color:var(--muted);font-size:12px}
.rg{position:relative;width:96px;height:96px}
.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
circle{fill:none}
.t0{stroke:rgba(255,255,255,.13)}
.p0{stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1)}
.fl{display:flex;align-items:center;gap:8px;height:96px}
.fl span{font-size:44px}.fl b{font-size:40px;font-weight:800}.fl em{font-style:normal;color:var(--muted);font-size:16px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 10px}
.sec h2{font-size:16px;font-weight:700}
.sec a{color:var(--pu2);font-size:13px;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;background:var(--glass);border:1px solid var(--line);border-radius:18px}
.ic{width:42px;height:42px;border-radius:50%;background:rgba(var(--rgb),.12);border:1px solid rgba(var(--rgb),.35);display:grid;place-items:center;font-size:19px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px}
.row small{color:var(--muted);font-size:12px}
.row .t b.dn{text-decoration:line-through;opacity:.6}
.st{text-align:center;line-height:1.2}.st b{font-size:17px;display:block}
.ck,.bx{width:34px;height:34px;border-radius:50%;border:2px solid rgba(var(--rgb),.5);background:transparent;color:#fff;font:700 15px "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer;flex:none;transition:.2s}
.ck.on,.bx.on{color:var(--on);background:var(--pu);border-color:var(--pu);box-shadow:0 0 14px rgba(var(--rgb),.7)}
.ck:active,.bx:active{transform:scale(.88)}
.x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:0 2px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.nav div{display:grid;grid-template-columns:repeat(5,1fr);justify-items:center;align-items:center;width:100%;max-width:496px;padding:8px;border-radius:26px;background:rgba(0,0,0,.55);border:1px solid var(--line);backdrop-filter:blur(16px)}
.nav button{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font:500 10px "Plus Jakarta Sans",system-ui,sans-serif}
.nav button.on{color:var(--pu2)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .plus{width:68px;height:68px;border-radius:50%;background:var(--pu);color:var(--on);padding:0;display:grid;place-items:center;box-shadow:0 0 24px rgba(var(--rgb),.75);margin:0}
.nav .plus svg{width:34px;height:34px;stroke-width:2.6;display:block}
.wn{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.wn button{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--pu2);font-size:20px;cursor:pointer}
.wn div{text-align:center}.wn b{display:block;font-size:18px}.wn small{color:var(--muted)}
.hc{padding:14px;margin-bottom:12px}
.hc .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hc .top b{flex:1}.hc .top small{color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font:600 12px "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.day.on{background:var(--pu);border-color:var(--pu);color:var(--on);box-shadow:0 0 12px rgba(var(--rgb),.6)}
.day.today:not(.on){border-color:var(--pu2);color:var(--ink)}
.day:disabled{opacity:.3;cursor:default}
.rt{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:12px}
.big{font-size:40px;font-weight:800;line-height:1;background:var(--pu);-webkit-background-clip:text;background-clip:text;color:transparent}
.dl{font-size:13px;margin-top:6px}.up{color:var(--pu)}.dw{color:var(--rd)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{padding:12px 6px;text-align:center;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.stats b{display:block;font-size:19px}.stats span{font-size:11px;color:var(--muted)}
.br{margin-bottom:12px}.br .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.br .b{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.br i{display:block;height:100%;border-radius:99px;background:var(--pu)}
.hist{display:flex;align-items:flex-end;gap:8px;height:120px}
.hist div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;font-size:10px;color:var(--muted)}
.hist i{display:block;border-radius:6px 6px 2px 2px;background:var(--pu);margin-bottom:4px;min-height:3px}
.hist .tdy{color:var(--ink);font-weight:700}
.hist .tdy i{box-shadow:0 0 12px rgba(var(--rgb),.6)}
.hist.fb{height:134px;gap:4px}
.hist .v{white-space:nowrap;font-size:10px}
.hist .pair{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:84px;margin-bottom:4px}
.hist .pair i{margin:0;min-height:0;width:9px;border-radius:4px 4px 1px 1px;background:var(--pu)}
.hist .pair i.mt{background:transparent;border:1px solid var(--pu2);opacity:.75}
.hist .pair i.ov{background:var(--rd)}
.hist .v{color:var(--ink);font-weight:600}
.hist .v.rd{color:var(--rd)}
.lg{margin:10px 0 0;font-size:11px;color:var(--muted);text-align:center}
.lg u{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;text-decoration:none}
.lg .m{border:1px solid var(--pu2)}
.lg .g{background:var(--pu)}
.dp{padding:16px;margin-bottom:4px;display:flex;align-items:center;gap:20px}
.di{display:flex;flex-direction:column;gap:2px}
.di b{font-size:28px;font-weight:800;line-height:1.1}
.dp small{color:var(--muted);font-size:12px}
.hist i.rd{background:var(--rd);box-shadow:none}
.br i.rd{background:var(--rd)}
.day.miss:not(.on){background:rgba(255,77,77,.16);border-color:var(--rd);color:var(--rd)}
.day.miss b{color:var(--rd)}
.si{width:22px;height:22px;fill:none;stroke:var(--pu);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic{box-shadow:0 0 12px rgba(var(--rgb),.25)}
.ig .si{width:24px;height:24px}
.br .l .si{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.hh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gear{width:42px;height:42px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--pu);cursor:pointer;display:grid;place-items:center;padding:0}
.gear svg,.x svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear svg{width:22px;height:22px}.x svg{width:19px;height:19px;display:block}
.x{padding:6px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tg button{position:relative;height:66px;border-radius:14px;border:2px solid var(--line);color:#fff;font:600 11px "Plus Jakarta Sans",system-ui,sans-serif;text-align:left;display:flex;align-items:flex-end;padding:7px 8px;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.tg button i{position:absolute;top:8px;right:8px;width:12px;height:12px;border-radius:50%}
.tg button.on{border-color:var(--ink);box-shadow:0 0 12px rgba(var(--rgb),.5)}
.dng{background:var(--rd)!important;border-color:var(--rd)!important;color:#000!important}
.dng2{color:var(--rd);border-color:var(--rd)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.g3>div{padding:10px 6px;text-align:center;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.g3 small{display:block;color:var(--muted);font-size:11px}
.g3 b{font-size:14px;font-weight:800}
.pos{color:var(--pu)}.neg{color:var(--rd)}
.gr{padding:12px 0 10px;border-bottom:1px solid var(--line)}
.gr:last-of-type{border-bottom:0}
.gt{display:flex;align-items:baseline;gap:6px}
.gt small{color:var(--muted);font-size:11px}
.gt .rs{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.gr.tdy .gt b{color:var(--pu)}
.gb{position:relative;height:12px;border-radius:99px;background:rgba(255,255,255,.1);margin:9px 0 6px}
.gb i{display:block;height:100%;border-radius:99px;background:var(--pu)}
.gb i.ov{background:var(--rd)}
.gb u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px;text-decoration:none}
.gs{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.lg u.mk{width:2px;height:12px;background:var(--ink);border-radius:2px;vertical-align:-2px}
.fa{display:flex;justify-content:flex-end;margin-top:10px}
.apb{padding:5px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 12px "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer}
.apb.dirty{background:var(--pu);border-color:var(--pu);color:var(--on)}
.apb.applied{border-color:var(--pu);color:var(--pu)}
.bn{padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-color:var(--pu)}
.bn b{display:block}
.bn small{display:block;color:var(--muted);font-size:12px}
.bn.bn2{flex-direction:column;align-items:stretch}
.bq{display:flex;gap:8px;align-items:center}
.bq input{padding:10px 12px}
.empty{text-align:center;color:var(--muted);padding:22px;border:1px dashed var(--line);border-radius:18px;margin-bottom:10px}
.btn{width:100%;margin-top:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:600 15px "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer}
.fs{padding:16px;margin-bottom:12px}
.fg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.fg3 small{display:block;color:var(--muted);font-size:11px}
.fg3 b{font-size:15px;font-weight:800}
.ft{padding:14px;margin-bottom:12px}
.ft label{margin:0 0 6px}
.fr{display:flex;gap:8px}
.btn2{padding:0 18px;border-radius:12px;border:0;background:var(--pu);color:var(--on);font:700 15px "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer}
.fd{padding:14px;margin-bottom:10px}
.fh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fh small{color:var(--muted);flex:1}
.fh span{font-size:12px;font-weight:600}
.fi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fi label{margin:0}
.nm{margin-bottom:10px;padding:10px 12px;font-size:15px}
.ok{color:var(--pu)}
.bad{color:var(--rd);background:rgba(255,77,77,.14);padding:1px 8px;border-radius:99px}
.stats.s2{grid-template-columns:repeat(2,1fr)}
.tbl{padding:8px 12px;margin-bottom:12px}
.tr{display:grid;grid-template-columns:.9fr 1fr 1fr 1.1fr;gap:6px;padding:8px 0;font-size:12px;border-bottom:1px solid var(--line)}
.tr:last-child{border:0}
.th{color:var(--muted);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:flex-end;justify-content:center;z-index:30}
.sheet.open{display:flex}
.panel{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.seg2{display:flex;gap:6px;padding:4px;border-radius:14px;background:rgba(255,255,255,.08);margin-bottom:6px}
.seg2 button{flex:1;padding:10px;border:0;border-radius:10px;background:none;color:var(--muted);font:600 14px "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer}
.seg2 button.on{background:var(--pu);color:var(--on)}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:400 16px "Plus Jakarta Sans",system-ui,sans-serif}
.pk{display:flex;gap:6px}
.pk button{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 14px "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer}
.pk button.on{background:var(--pu);border-color:var(--pu);color:var(--on)}
.ig{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:200px;overflow:auto;padding:2px}
.ig button{height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:21px;cursor:pointer;padding:0}
.ig button.on{background:rgba(var(--rgb),.18);border-color:var(--pu);box-shadow:0 0 10px rgba(var(--rgb),.4)}
.act{display:flex;gap:10px;margin-top:20px}
.act button{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);font:700 15px "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer}
.act .go{background:var(--pu);border-color:var(--pu);color:var(--on)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--pu);color:var(--on);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;display:none}
.spark{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:50}
button:focus-visible,input:focus-visible{outline:2px solid var(--pu2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav"><div>
  <button data-t="hoje"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoje</button>
  <button data-t="semana"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Semana</button>
  <button class="plus" id="add" aria-label="Adicionar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-t="rel"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Relatório</button>
  <button data-t="fin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.6 9.3c-.5-.8-1.4-1.3-2.6-1.3-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2c-1.2 0-2.1-.5-2.6-1.3M12 6v2M12 16v2"/></svg>Gastos</button>
</div></nav>

<div class="sheet" id="sheet"><div class="panel" role="dialog" aria-modal="true" aria-label="Adicionar">
  <h2 style="margin:0 0 4px;font-size:20px">Novo hábito diário</h2>
  <label for="ttl">Título</label><input id="ttl" maxlength="60" placeholder="Ex.: Meditar">
  <div id="fh"><label for="sb">Detalhe</label><input id="sb" maxlength="30" placeholder="Ex.: 20 min">
    <label>Ícone</label><div class="ig" id="icp"></div>
    <label>Em quais dias? (uma conclusão por dia)</label><div class="pk" id="dp"></div></div>
  
  <div class="act"><button id="cancel">Cancelar</button><button class="go" id="save">Salvar</button></div>
</div></div>
<div class="sheet" id="cs"><div class="panel" role="dialog" aria-modal="true" aria-label="Configurações">
  <h2 style="margin:0 0 4px;font-size:20px">Configurações</h2>
  <label>Tema</label><div class="tg" id="tg"></div>
  <label>Som</label><button class="btn" id="snd" style="margin-top:0"></button>
  <label>Dados</label><button class="btn dng2" id="clr">Limpar tudo</button>
  <div class="act"><button id="csx">Fechar</button></div>
</div></div>
<div class="sheet" id="cf" style="z-index:35"><div class="panel" role="alertdialog" aria-modal="true">
  <h2 style="margin:0 0 6px;font-size:20px">Tem certeza?</h2><p id="cfm" style="color:var(--muted);margin:0"></p>
  <div class="act"><button id="cfn">Cancelar</button><button class="go dng" id="cfy">Confirmar</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>add(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-((d.getDay()+6)%7));
const fmt=(d,o)=>d.toLocaleDateString('pt-BR',o);

const blank=()=>({m:Array(7).fill(null),g:Array(7).fill(null),closed:false,n:Array(7).fill('')});
const fr=k=>(db.fin&&db.fin[k])||blank();
const fd=k=>{db.fin=db.fin||{};const w=db.fin[k]||(db.fin[k]=blank());if(!w.n)w.n=Array(7).fill('');return w};
const inp=n=>n==null?'':String(n).replace('.',',');
function finTop(k){return `<div class="card dp" style="margin-bottom:12px"><div class="di"><small>Total da semana</small><b>${R(ftot(k))}</b></div></div>`}
function vFin(){const w=fr(wk);
return `<header class="hd"><h1>Gastos</h1></header>${wkNav()}
<div id="ftop">${finTop(wk)}</div>
<div id="fch">${finChart(wk)}</div>
<div class="sec"><h2>Total por dia</h2></div>
${DF.map((n,i)=>{const ap=w.g[i]!=null;return `<div class="row"><div class="t"><b>${n}</b><small>${fmt(add(parse(wk),i),{day:'numeric',month:'short'})}</small></div><input id="fg${i}" style="width:104px;text-align:right;padding:10px" inputmode="decimal" data-f="g" data-i="${i}" placeholder="R$ 0,00" aria-label="Gasto de ${n}" value="${inp(w.g[i])}"><button class="apb${ap?' applied':''}" id="apb${i}" data-ap="${i}">${ap?'✓ Aplicado':'Aplicar'}</button></div>`}).join('')}`}
function setAp(i,st){const b=$('#apb'+i);if(!b)return;b.className='apb '+st;b.textContent=st==='applied'?'✓ Aplicado':'Aplicar'}
function applyDay(i){sfx('ok');const w=fd(wk),el=$('#fg'+i),v=el.value.trim();w.g[i]=v===''?null:num(v);save();el.value=inp(w.g[i]);
setAp(i,w.g[i]!=null?'applied':'');$('#ftop').innerHTML=finTop(wk);$('#fch').innerHTML=finChart(wk);toast(w.g[i]!=null?'Aplicado: '+DF[i]:'Dia limpo: '+DF[i])}
function render(){$('#app').innerHTML=({hoje:vHoje,semana:vSemana,rel:vRel,fin:vFin})[tab]();
document.querySelectorAll('.nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function go(t){tab=t;render();window.scrollTo(0,0)}

$('#app').addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;const d=b.dataset;
if(b.id==='cfg')return openCfg();
if(d.go)return go(d.go);
if(d.h){const h=db.habits.find(x=>x.id==d.h),k=d.d||TODAY;h.log[k]?delete h.log[k]:h.log[k]=true;save();render();
if(h.log[k]&&k===TODAY){const hs=db.habits.filter(x=>planned(x,TI,TODAY));if(hs.every(x=>x.log[TODAY]))fx($('.ck.on')||b)}return}
if(d.dh){const h=db.habits.find(x=>x.id==d.dh);ask('O hábito “'+h.title+'” e o histórico dele serão apagados.','Excluir',()=>{db.habits=db.habits.filter(x=>x.id!=d.dh);save();render()});return}
if(d.w){wk=shift(wk,+d.w);render();return}
if(d.ap!==undefined)return applyDay(+d.ap);
if(b.id==='copy'){navigator.clipboard.writeText(rep).then(()=>toast('Relatório copiado'),()=>toast('Não foi possível copiar aqui'))}});
document.querySelectorAll('.nav [data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));

function pickers(){$('#icp').innerHTML=ICONS.map(i=>`<button type="button" class="${i===icon?'on':''}" data-i="${i}" aria-label="Ícone ${i}">${ico(i)}</button>`).join('');
$('#dp').innerHTML=DF.map((n,i)=>`<button type="button" class="${plan[i]?'on':''}" data-i="${i}" aria-label="${n}" aria-pressed="${plan[i]}">${DN[i]}</button>`).join('');}
const sheet=v=>$('#sheet').classList.toggle('open',v);
$('#add').onclick=()=>{$('#ttl').value='';$('#sb').value='';plan=ALL.slice();icon='target';pickers();sheet(true);setTimeout(()=>$('#ttl').focus(),60)};
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('button');if(e.target.id==='sheet')return sheet(false);if(!b)return;const d=b.dataset;
if(d.i&&b.parentNode.id==='icp'){icon=d.i;pickers()}else if(d.i){plan[+d.i]=!plan[+d.i];pickers()}
else if(b.id==='cancel')sheet(false);
else if(b.id==='save'){const t=$('#ttl').value.trim();if(!t)return $('#ttl').focus();
{if(!plan.some(Boolean))return toast('Escolha ao menos um dia');db.habits.push({id:Date.now(),title:t,sub:$('#sb').value.trim(),icon,plan:plan.slice(),start:TODAY,log:{}})}
save();sheet(false);render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){sheet(false);sw('#cs',false);sw('#cf',false)}});
$('#app').addEventListener('input',e=>{const d=e.target.dataset;if(d.f)setAp(+d.i,'dirty')});
$('#app').addEventListener('keydown',e=>{const d=e.target.dataset;if(e.key==='Enter'&&d&&d.f)applyDay(+d.i)});
const sw=(id,v)=>$(id).classList.toggle('open',v);
function applyTheme(){const t=TH.find(x=>x[0]===db.theme)||TH[0],r=document.documentElement.style;[['--bgi',t[2]],['--pu',t[3]],['--pu2',t[4]],['--rgb',t[5]],['--on',t[6]],['--bg2',t[7]],['--muted',t[8]]].forEach(([k,v])=>r.setProperty(k,v))}
function themeGrid(){$('#tg').innerHTML=TH.map(t=>`<button type="button" data-th="${t[0]}" class="${(db.theme||'neon')===t[0]?'on':''}" style="background:${t[2]}" aria-label="Tema ${t[1]}"><i style="background:${t[3]}"></i>${t[1]}</button>`).join('')}
function openCfg(){themeGrid();$('#snd').textContent='Som dos botões: '+(db.mute?'desligado':'ligado');sw('#cs',true)}
let cfFn=null;
function ask(msg,yes,fn){$('#cfm').textContent=msg;$('#cfy').textContent=yes;cfFn=fn;sw('#cf',true)}
$('#cs').addEventListener('click',e=>{const b=e.target.closest('button');if(e.target.id==='cs'||(b&&b.id==='csx'))return sw('#cs',false);if(!b)return;
if(b.dataset.th){db.theme=b.dataset.th;save();applyTheme();themeGrid();return}
if(b.id==='snd'){db.mute=!db.mute;save();$('#snd').textContent='Som dos botões: '+(db.mute?'desligado':'ligado');sfx('on');return}
if(b.id==='clr')ask('Isso apaga todos os hábitos, marcações, metas e gastos. Não dá para desfazer.','Limpar tudo',()=>{db={habits:[],fin:{},theme:db.theme,mute:db.mute};wk=key(monday(new Date()));save();sw('#cs',false);render();toast('Tudo limpo')})});
$('#cf').addEventListener('click',e=>{const b=e.target.closest('button');if(e.target.id==='cf'||(b&&b.id==='cfn'))return sw('#cf',false);
if(b&&b.id==='cfy'){sw('#cf',false);const f=cfFn;cfFn=null;f&&f()}});
let AC=null;
function sfx(k){if(db.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,
q={tap:[[700,0,.07]],on:[[660,0,.09],[990,.08,.16]],off:[[440,0,.1],[330,.08,.12]],ok:[[523,0,.09],[659,.09,.09],[880,.18,.2]],del:[[320,0,.12],[210,.1,.18]]}[k]||[[600,0,.06]];
q.forEach(([f,t,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,n+t);g.gain.linearRampToValueAtTime(.5,n+t+.012);g.gain.exponentialRampToValueAtTime(.001,n+t+d);o.connect(g);g.connect(AC.destination);o.start(n+t);o.stop(n+t+d+.03)})}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.ap!==undefined||b.id==='bgok'||b.id==='snd')return;
sfx(d.h!==undefined?(b.getAttribute('aria-pressed')==='true'?'off':'on'):(d.dh!==undefined||b.id==='clr'||b.id==='cfy')?'del':(b.id==='add'||b.id==='save')?'ok':'tap')},true);
load();applyTheme();render();
</script>
</body>
</html>
